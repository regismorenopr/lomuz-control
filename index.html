<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem maximum-scale/user-scalable: o zoom até 200% precisa funcionar
         (requisito de acessibilidade). O layout se adapta por media query. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lomuz Control</title>
    <meta name="description" content="Controle financeiro e gestão da equipe de vendas." />
    <meta name="theme-color" content="#18112B" />

    <!-- Ícones gerados a partir de favicon.svg (mesmo desenho em todos). O .ico
         carrega 16/32/48 dentro dele e atende navegador antigo e atalho do
         Windows; os PNG soltos são o que navegador moderno prefere. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
